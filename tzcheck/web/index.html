<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чекни! Проверка ТЗ</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="preload" href="/static/img/hero.jpg" as="image">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">
    <span class="brand-name">Чекни!</span>
    <span class="brand-sub">Проверка ТЗ по 223-ФЗ</span>
  </a>
  <button class="menu-btn" id="menu-btn" aria-label="Меню" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <nav class="nav" id="nav">
    <a href="#/" data-route="check">Проверка</a>
    <a href="#/history" data-route="history">История</a>
    <a href="#/norms" data-route="norms">Нормативная база</a>
    <a href="/refdata">Справочники</a>
  </nav>
</header>

<main id="view"></main>

<template id="tpl-start">
  <section class="start">
    <div class="hero" aria-hidden="true"><div class="hero-img"></div></div>
    <div class="start-inner">
      <form class="card form" id="check-form" novalidate>
        <div class="form-head">
          <div>
            <h1>Проверка ТЗ</h1>
          </div>
          <a class="icon-btn" href="#/norms" title="Нормативная база" aria-label="Нормативная база">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.5-2-3.4-2.3.9a7.5 7.5 0 0 0-2.6-1.5L14.1 2.5h-4.2l-.4 2.5a7.5 7.5 0 0 0-2.6 1.5l-2.3-.9-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3l-2 1.5 2 3.4 2.3-.9c.8.6 1.6 1.1 2.6 1.5l.4 2.5h4.2l.4-2.5c1-.4 1.8-.9 2.6-1.5l2.3.9 2-3.4-2-1.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          </a>
        </div>

        <div class="field">
          <div class="label-row"><span class="label">Документы</span><span class="muted small" id="file-count"></span></div>
          <label class="drop" id="drop">
            <input type="file" id="file-input" multiple accept=".docx,.doc,.rtf,.odt,.pdf,.xlsx,.txt,.png,.jpg,.jpeg,.tif,.tiff">
            <span class="drop-icon"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
            <span class="drop-text"><b>Перетащите ТЗ или выберите файл</b><span class="muted small">docx, doc, rtf, odt, pdf, xlsx, txt, скан или фото</span></span>
          </label>
          <ul class="files" id="files"></ul>
          <p class="err small" id="files-err" hidden></p>
        </div>

        <div class="field">
          <span class="label">Что проверять</span>
          <div class="pills" id="groups" role="group" aria-label="Группы проверок"></div>
          <p class="muted small cats" id="cats" hidden></p>
        </div>

        <div class="field settings">
          <label class="switch" id="llm-row">
            <input type="checkbox" id="use-llm">
            <span class="track" aria-hidden="true"></span>
            <span class="switch-text">Использовать модель <span class="muted small" id="llm-note"></span></span>
          </label>
          <label class="switch">
            <input type="checkbox" id="public">
            <span class="track" aria-hidden="true"></span>
            <span class="switch-text">Открытый документ, например из ЕИС <span class="muted small hint">без отметки персональные данные скрываются до отправки в модель</span></span>
          </label>
          <label class="text-field">
            <span class="label">Проверяющий</span>
            <input type="text" id="user" maxlength="120" placeholder="Фамилия И. О." autocomplete="name">
          </label>
        </div>

        <div class="field">
          <button type="button" class="link-btn" id="prev-toggle" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Сопоставить с прошлым ТЗ
          </button>
          <div class="prev" id="prev-box" hidden>
            <label class="file-pick">
              <input type="file" id="prev-input" accept=".docx,.doc,.rtf,.odt,.pdf,.xlsx,.txt">
              <span id="prev-name">Выбрать прошлый документ</span>
            </label>
          </div>
        </div>

        <p class="err" id="submit-err" hidden></p>
        <button type="submit" class="btn-primary" id="submit">Проверить</button>
      </form>
    </div>
  </section>
</template>

<template id="tpl-job">
  <section class="start job-screen">
    <div class="hero veil" aria-hidden="true"><div class="hero-img"></div></div>
    <div class="start-inner">
      <div class="card job">
        <div class="job-head">
          <div class="job-title">
            <span class="eyebrow" id="job-state">Проверка идёт</span>
            <h1 id="job-file">Документ</h1>
            <p class="muted small" id="job-meta"></p>
          </div>
          <span class="timer" id="job-timer">0:00</span>
        </div>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="job-bar"><span id="job-bar-fill"></span></div>
        <p class="current" id="job-current" aria-live="polite"></p>
        <ol class="steps" id="job-steps"></ol>
        <div class="job-foot" id="job-foot" hidden></div>
      </div>
    </div>
  </section>
</template>

<template id="tpl-run">
  <section class="result">
    <div class="r-top">
      <div class="r-title">
        <span class="thumb" aria-hidden="true"></span>
        <div class="r-title-text">
          <h1 id="r-file">Документ</h1>
          <p class="muted small" id="r-meta"></p>
        </div>
      </div>
      <div class="r-actions" id="r-actions"></div>
    </div>
    <p class="muted small rev-note" id="r-rev-note"></p>

    <div class="verdict" id="r-verdict">
      <p class="verdict-text" id="r-verdict-text"></p>
      <p class="incomplete" id="r-incomplete" hidden></p>
      <div class="mode small muted" id="r-mode"></div>
    </div>

    <div class="stats" id="r-stats"></div>

    <details class="journal" id="r-journal"><summary>Журнал проверки</summary><div id="r-journal-body"></div></details>

    <div class="toolbar">
      <div class="segmented" id="r-sections" role="group" aria-label="Раздел"></div>
      <div class="tabs-row" id="r-tabs" role="tablist" aria-label="Группы"></div>
      <div class="filters">
        <div class="status-filter" id="r-status" role="group" aria-label="Статус"></div>
        <div class="tools">
          <label class="search"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><input type="search" id="r-q" placeholder="Поиск по тексту и номеру" aria-label="Поиск"></label>
          <label class="sort small muted">Порядок
            <select id="r-sort"><option value="risk">по риску</option><option value="doc">по документу</option></select>
          </label>
        </div>
      </div>
      <p class="muted small" id="r-count"></p>
    </div>

    <div class="list" id="r-list"></div>
  </section>
</template>

<script type="module" src="/static/app.js"></script>
</body>
</html>
